description = 'Very basic dependencies that have to be built before commons, no use of Bukkit.'

dependencies {
    testImplementation 'junit:junit:4.8.2'
}

// BuildParameters.properties is filtered at build time. Under Maven only the java.*
// values were ever filled in: buildTimestamp, BUILD_SERIES, BUILD_NUMBER, TEST_LEVEL
// and DEBUG_LEVEL were undefined and therefore stayed in the jar as literal ${...}
// placeholders, which is what BuildParameters.java expects to cope with.
//
// Gradle's template expansion insists on every placeholder being defined, so the
// unresolved ones are mapped to their own placeholder text to keep the output
// byte-identical. It also reads `${java.vm.vendor}` as property access rather than as
// a literal key, hence the nested `java` map.
def buildParameters = [
        'buildTimestamp': '${buildTimestamp}',
        'BUILD_SERIES'  : '${BUILD_SERIES}',
        'BUILD_NUMBER'  : '${BUILD_NUMBER}',
        'TEST_LEVEL'    : '${TEST_LEVEL}',
        'DEBUG_LEVEL'   : '${DEBUG_LEVEL}',
        'java'          : [
                'vendor'       : System.getProperty('java.vendor'),
                'version'      : System.getProperty('java.version'),
                'vm'           : ['vendor': System.getProperty('java.vm.vendor'),
                                 'version': System.getProperty('java.vm.version')],
                'specification': ['vendor': System.getProperty('java.specification.vendor'),
                                  'version': System.getProperty('java.specification.version')],
        ],
]

tasks.named('processResources') {
    filesMatching('BuildParameters.properties') {
        expand(buildParameters)
    }
}
