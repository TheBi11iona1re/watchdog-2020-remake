// The plugin jar: shades the NCP modules into a single artifact, replaces
// maven-shade-plugin. The module itself has no sources, it only contributes the
// filtered plugin.yml and LICENSE.txt.

plugins {
    id 'com.gradleup.shadow'
}

// The plugin/artifact version, the other modules use 1.1-SNAPSHOT.
version = '3.10.8-hypixel2020-SNAPSHOT'
description = 'Detect and fight the exploitation of various flaws/bugs in Minecraft.'

// The plugin jar is the build product that matters, so it stays where the Maven build
// put it: <root>/target/NoCheatPlus.jar.
layout.buildDirectory = rootProject.file('target')
base {
    archivesName = 'NoCheatPlus'
}

dependencies {
    api project(':NCPPlugin')
}

// Replaces the `timestamp` / `dynamic_build_number` profile pair: BUILD_NUMBER wins
// when the environment provides it, otherwise a yyyy_MM_dd-HH_mm timestamp is used.
def buildNumber = System.getenv('BUILD_NUMBER')
def buildDescription = buildNumber ? "b$buildNumber" : new Date().format('yyyy_MM_dd-HH_mm', TimeZone.getDefault())

// LICENSE.txt and plugin.yml are copied to the root of the jar, with the placeholders of
// NCPPlugin/src/main/resources/plugin.yml filled in. Computed here so that the closure
// below does not have to reach back into the project.
def pluginYmlValues = [
        project         : [
                name        : 'NoCheatPlus',
                version     : version.toString(),
                groupId     : group.toString(),
                artifactId  : 'nocheatplus',
                description : description,
                url         : 'https://dev.bukkit.org/projects/nocheatplus',
        ],
        buildDescription: buildDescription,
        BUILD_SERIES: 'hypixel2020',
        BUILD_NUMBER: buildNumber ?: new Date().format('yyyyMMdd.HHmmss'),
]

tasks.named('processResources') {
    inputs.property('pluginYmlValues', pluginYmlValues.toString())
    from rootProject.file('LICENSE.txt')
    from(rootProject.project(':NCPPlugin').file('src/main/resources')) {
        include 'plugin.yml'
    }
    filesMatching('plugin.yml') {
        expand(pluginYmlValues)
    }
}

tasks.named('shadowJar') {
    // Maven's <finalName>NoCheatPlus</finalName>: NoCheatPlus.jar rather than
    // NoCheatPlus-3.17.1-SNAPSHOT-all.jar. Compile-only dependencies (spigot-api,
    // ProtocolLib, the server jars) are not part of runtimeClasspath and therefore
    // stay out of the jar, as with Maven's provided scope.
    archiveFileName = 'NoCheatPlus.jar'
    // Next to it, not in libs/, where the thin jar (which only carries the resources)
    // is written, so the two do not collide.
    destinationDirectory = layout.buildDirectory
    // plugin.yml is contributed by this module and by ncpplugin.jar. Maven's shade
    // plugin kept the first entry, so exclude the later duplicate rather than writing
    // two entries for the same path.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
