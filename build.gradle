plugins {
    id 'java'
}

group = 'fr.neatmonster'
version = '3.10.8-hypixel2020-SNAPSHOT'

def serverJar = providers.gradleProperty('ncp.serverJar').getOrElse(
        layout.projectDirectory.file('gradle/ncp-libs/spigot-1.8.8.jar').asFile.path)

dependencies {
    compileOnly files(serverJar)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

def buildNumber = System.getenv('BUILD_NUMBER')
def pluginValues = [
        project: [name: 'NoCheatPlus', version: version.toString(), groupId: group.toString(),
                  artifactId: 'nocheatplus', description: 'Detect and fight the exploitation of various flaws/bugs in Minecraft.',
                  url: 'https://dev.bukkit.org/projects/nocheatplus'],
        buildDescription: buildNumber ? "b$buildNumber" : new Date().format('yyyy_MM_dd-HH_mm', TimeZone.getDefault()),
        BUILD_SERIES: 'hypixel2020',
        BUILD_NUMBER: buildNumber ?: new Date().format('yyyyMMdd.HHmmss'),
]
def buildParameters = [
        buildTimestamp: '${buildTimestamp}',
        BUILD_SERIES: '${BUILD_SERIES}',
        BUILD_NUMBER: '${BUILD_NUMBER}',
        TEST_LEVEL: '${TEST_LEVEL}',
        DEBUG_LEVEL: '${DEBUG_LEVEL}',
        java: [vendor: System.getProperty('java.vendor'), version: System.getProperty('java.version'),
               vm: [vendor: System.getProperty('java.vm.vendor'), version: System.getProperty('java.vm.version')],
               specification: [vendor: System.getProperty('java.specification.vendor'),
                               version: System.getProperty('java.specification.version')]],
]

tasks.named('processResources') {
    inputs.properties(pluginValues: pluginValues.toString(), buildParameters: buildParameters.toString())
    filesMatching('plugin.yml') {
        expand(pluginValues)
    }
    filesMatching('BuildParameters.properties') {
        expand(buildParameters)
    }
    from('LICENSE.txt')
}

tasks.named('jar') {
    archiveFileName = 'NoCheatPlus.jar'
    destinationDirectory = layout.projectDirectory.dir('target')
}

defaultTasks 'jar'
