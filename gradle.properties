# Gradle 9 requires Java 17 or later to run the build. Note that this is only about
# running Gradle itself: the plugin is still compiled for Java 8 (see `options.release`
# in build.gradle).
#
# If the `java` on your PATH is older than 17, point the build at a newer JDK, either
# with JAVA_HOME or by uncommenting and adapting the line below:
#
#   org.gradle.java.home=/usr/lib/jvm/java-21-openjdk

org.gradle.jvmargs=-Xmx1g
org.gradle.caching=true
